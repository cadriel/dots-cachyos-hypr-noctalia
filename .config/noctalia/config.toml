[notification]
filter_order = []
history_retention_hours = 1

[osd]
background_opacity = 0.9499999787658453

[plugin_settings."kenn/keybind-cheatsheet"]
hyprland_parser = "lua"
show_undescribed = false

[plugin_settings."noctalia/wallhaven"]
browser_placement = "floating"
browser_position = "center"
download_dir = "/home/craig/Pictures/Wallpapers"

[plugin_settings."rylos/syncthing"]
notify_events = false
panel_placement = "floating"

[plugins]
enabled = [ "kenn/keybind-cheatsheet", "noctalia/wallhaven", "rylos/syncthing" ]

[shell]
clipboard_image_action_command = "swash --stdin --name \\\"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\\\""
corner_radius_scale = 2.0
font_family = "Inter"
launch_apps_as_systemd_services = true
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.launcher]
    app_grid = false
    categories = true
    compact = true

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "top_center"
    launcher_position = "center"
    session_placement = "floating"
    session_position = "top_center"
    transparency_mode = "solid"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    pipe_command = "swash --stdin --name \\\"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\\\""
    pipe_to_command = true

    [shell.shadow]
    alpha = 0.19999999552965164

[theme]
builtin = "Ayu"
community_palette = "Everforest Material"
mode = "dark"
source = "community"
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "micro" ]

[wallpaper]
directory = "/home/craig/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/craig/Pictures/Wallpapers/wallhaven-5yz9j9.jpg"

    [wallpaper.last]
    path = "/home/craig/Pictures/Wallpapers/wallhaven-5yz9j9.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/craig/Pictures/Wallpapers/wallhaven-5yz9j9.jpg"

[widget.active_window]
color = "on_surface_variant"

[widget.audio_visualizer]
bands = 32
mirrored = false
reversed = true
width = 128

[widget.bar_2]
type = "rylos/syncthing:bar"

[widget.brightness]
color = "on_surface_variant"

[widget.clock]
color = "on_surface_variant"
format = "{:%a %-d %b, %I:%M %p}"

[widget.launcher]
color = "on_surface_variant"

[widget.media]
color = "on_surface_variant"
hide_when_no_media = true

[widget.network]
color = "on_surface_variant"

[widget.notifications]
color = "on_surface_variant"

[widget.session]
color = "error"

[widget.tray]
color = "on_surface_variant"

[widget.volume]
color = "on_surface_variant"

[widget.weather]
color = "on_surface_variant"
show_condition = false

[widget.workspaces]
capsule_fill = "surface_container"
empty_color = "on_surface_variant"
label_source = "name"
max_label_chars = 12
occupied_color = "on_surface_variant"
show_labels = false
