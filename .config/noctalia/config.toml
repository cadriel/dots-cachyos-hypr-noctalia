[accessibility]
ui_scale = 1.1000000089406967

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.69999998435378075
    capsule = true
    capsule_foreground = "on_surface_variant"
    capsule_radius = 14
    capsule_thickness = 0.69999998807907104
    center = [ "workspaces" ]
    color = "primary"
    concave_edge_corners = true
    contact_shadow = true
    end = [ "tray", "bar_2", "group:g2", "clock", "group:g3", "session" ]
    font_family = "Inter"
    font_weight = 400
    margin_edge = 0
    margin_ends = 0
    padding = 16
    radius = 0
    radius_bottom_left = 0
    radius_bottom_right = 0
    radius_top_right = 0
    start = [ "launcher", "group:g1", "media", "audio_visualizer" ]
    thickness = 38
    widget_spacing = 10

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = ""
        enabled = true
        fill = "surface_container"
        foreground = "on_surface_variant"
        id = "g1"
        members = [ "cpu", "ram", "temp" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_container"
        foreground = "on_surface_variant"
        id = "g2"
        members = [ "weather", "volume", "brightness", "power_profile", "network" ]
        opacity = 1.0
        padding = 6.0
        radius = 14.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_container"
        foreground = "on_surface_variant"
        id = "g3"
        members = [ "notifications", "caffeine" ]
        opacity = 1.0
        padding = 6.0
        radius = 14.0

[brightness]
enable_ddcutil = true
minimum_brightness = 0.19999999552965164

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[location]
auto_locate = true

